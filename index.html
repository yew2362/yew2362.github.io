<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yew2362</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #000000, #1f1f1f);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .container {
      background-color: #2a2a2a;
      padding: 2rem;
      border-radius: 1.5rem;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      animation: popIn 0.8s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      font-size: 2rem;
      animation: fadeUp 0.8s ease-in-out;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #444;
      object-fit: cover;
      box-shadow: 0 0 12px #00000080;
      animation: fadeIn 1s ease-in-out;
    }

    .button {
      display: block;
      width: 100%;
      padding: 1rem;
      margin: 1rem 0;
      border: none;
      border-radius: 1rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      text-decoration: none;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .button:nth-child(1) { animation-delay: 0.2s; }
    .button:nth-child(2) { animation-delay: 0.4s; }
    .button:nth-child(3) { animation-delay: 0.6s; }

    .spotify { background: #1DB954; }
    .spotify:hover { background: #1aa34a; }

    .youtube { background: #FF0000; }
    .youtube:hover { background: #cc0000; }

    .discord { background: #5865F2; }
    .discord:hover { background: #4752c4; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      width: 80%;
      max-width: 300px;
      box-shadow: 0 0 20px #00000090;
    }

    .close-btn {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #5865F2;
      border: none;
      border-radius: 0.5rem;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <img class="avatar" src="https://raw.githubusercontent.com/yew2362/yew2362.github.io/refs/heads/main/159490183.png" alt="Profile picture" />
    <h1>@yew2362</h1>

    <a href="https://open.spotify.com/user/31lq34fpiqrs5sedpuswtpl2ncla?si=Ojz5dse_Qb6g7GZT9UbniA" target="_blank" class="button spotify">🎵 Spotify</a>
    <a href="https://youtube.com/@yew2362" target="_blank" class="button youtube">📺 YouTube</a>
    <button onclick="showDiscord()" class="button discord">💬 Discord</button>
  </div>

  <div class="modal" id="discordModal">
    <div class="modal-content">
      <h2>My Discord</h2>
      <p style="font-family: monospace; font-size: 1.2rem;">@yew2362</p>
      <button class="close-btn" onclick="hideDiscord()">Close</button>
    </div>
  </div>

  <script>
    function showDiscord() {
      document.getElementById('discordModal').style.display = 'flex';
    }

    function hideDiscord() {
      document.getElementById('discordModal').style.display = 'none';
    }
  </script>

</body>
</html>
